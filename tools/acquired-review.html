<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新采集片段审核</title><style>body{font:16px/1.7 system-ui;background:#f2f5f2;color:#153b43;max-width:1100px;margin:30px auto;padding:20px}video{width:100%;max-height:530px}button,input,textarea,select{font:inherit;padding:9px;margin:5px;border-radius:7px}textarea{display:block;width:95%}section{background:white;padding:20px;border-radius:12px;margin:15px 0}#tags label{display:inline-block;margin:7px}a{color:#087f80}</style><h1>新采集素材 · 人工确认</h1><p>这是实际下载的代表性窗口，不是已识别出的战术。请按画面选多个标签、标记参与者和动作区间；没有明确事件也可排除，看不清选不确定。确认不自动批准训练。</p><label>审核者<input id="reviewer"></label><select id="queue"></select><button id="reload">刷新</button><p id="message"></p><section><p id="source"></p><video id="video" controls preload="metadata"></video><p id="provenance"></p></section><section><div id="tags"></div><label>片段起点秒<input id="start" type="number" min="0" step="0.001" value="0"></label><button id="markStart">取当前时间</button><label>终点秒<input id="end" type="number" min="0" step="0.001"></label><button id="markEnd">取当前时间</button><textarea id="participants" placeholder="参与者与关系，例如白衣7号传给白衣12号；未知则说明"></textarea><textarea id="note" placeholder="动作证据、遮挡、需要修改或排除原因"></textarea><label><input id="viewed" type="checkbox">我已播放并核对该区间</label><button data-decision="confirmed">确认所填标签</button><button data-decision="uncertain">仍不确定</button><button data-decision="rejected">排除此窗口</button></section><script>
const token='__TOKEN__',taxonomy=__TAXONOMY__;const $=id=>document.getElementById(id);let rows=[];let selected=null;function node(t,s){const e=document.createElement(t);e.textContent=s;return e}for(const [group,labels] of Object.entries(taxonomy)){const box=node('div','');box.append(node('h3',group));for(const [id,title] of labels){const label=node('label',title),i=document.createElement('input');i.type='checkbox';i.value=id;i.className='tag';label.prepend(i);box.append(label)}$('tags').append(box)}function show(){selected=rows.find(r=>r.id===$('queue').value);if(!selected)return;$('video').src='/api/media/'+encodeURIComponent(selected.id);$('source').textContent=selected.id+' · '+selected.duration.toFixed(3)+'秒 · '+(selected.assistant_hint||'待核验窗口');$('provenance').textContent='原始出处：'+selected.source_url+' · 源视频偏移 '+selected.source_start+'秒 · 仅候选，训练用途未批准';$('start').value=selected.review?.start??0;$('end').value=selected.review?.end??selected.duration;$('participants').value=selected.review?.participants||'';$('note').value=selected.review?.note||'';for(const i of document.querySelectorAll('.tag'))i.checked=(selected.review?.tags||[]).includes(i.value);$('viewed').checked=false}async function load(){try{const old=$('queue').value;const r=await fetch('/api/queue');if(!r.ok)throw Error('加载失败');rows=await r.json();$('queue').replaceChildren();for(const row of rows){const o=node('option',row.id+' · '+(row.review?.decision||'待审'));o.value=row.id;$('queue').append(o)}if(rows.some(r=>r.id===old))$('queue').value=old;show();$('message').textContent='共'+rows.length+'条真实素材窗口；未审核不当作训练答案'}catch(e){$('message').textContent=e.message}}$('queue').onchange=show;$('reload').onclick=load;$('markStart').onclick=()=>$('start').value=$('video').currentTime.toFixed(3);$('markEnd').onclick=()=>$('end').value=$('video').currentTime.toFixed(3);for(const b of document.querySelectorAll('[data-decision]'))b.onclick=async()=>{if(!selected)return;try{const r=await fetch('/api/review/'+encodeURIComponent(selected.id),{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({revision:selected.revision,reviewer:$('reviewer').value,viewed:$('viewed').checked,decision:b.dataset.decision,tags:[...document.querySelectorAll('.tag:checked')].map(i=>i.value),start:Number($('start').value),end:Number($('end').value),participants:$('participants').value,note:$('note').value})});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));await load();$('message').textContent='已保存本次人工决定；训练状态仍为待批准'}catch(e){$('message').textContent=e.message}};load();
</script></html>
