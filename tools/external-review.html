<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部标注复核</title><style>body{background:#122139;color:white;font:16px/1.7 sans-serif;max-width:1050px;margin:30px auto;padding:18px}section{padding:24px;background:#203650;border-radius:14px;margin:20px 0}button,input,select,textarea{font:inherit;padding:10px;margin:5px;border-radius:8px}video{width:100%;max-height:540px}textarea{width:95%;min-height:70px}pre{white-space:pre-wrap;word-break:break-word}.warn{color:#ffd28c}</style><h1>外部标注 · 代表性样本复核</h1><p>先审有视频的9条。比较目标出手：是否为同一球、球员和结果是否对应、动作分类是否合适。不能批准片段之外的整个回合。</p><label>审核者 <input id="reviewer"></label><label><input type="checkbox" id="videos" checked>仅有视频</label><label><input type="checkbox" id="pending" checked>仅未提交</label><p id="progress"></p><button id="prev">上一条</button><button id="next">下一条</button><section><h2 id="title"></h2><p id="target"></p><p id="warning" class="warn"></p><div id="media"></div><details><summary>外部标注、异常与本地对照详情</summary><pre id="details"></pre></details></section><section><label><input id="confirmed" type="checkbox">我已核对当前样本；无视频时只核对文字</label><textarea id="note" placeholder="问题、改正意见、动作细分（如抛投而非上篮）"></textarea><button data-vote="visually_consistent_target">目标出手与画面一致</button><button data-vote="visually_inconsistent_target">目标出手与画面不一致</button><button data-vote="uncertain">无法判断／需修改</button><button data-vote="text_only_consistent">仅文字自洽，不确认画面</button><p id="status" role="status"></p></section><script>
const token='__TOKEN__',$=id=>document.getElementById(id);let all=[],queue=[],index=0,busy=false;$('reviewer').value=localStorage.getItem('external-reviewer')||'';
async function load(){try{const r=await fetch('/api/samples');if(!r.ok)throw Error('加载失败');all=await r.json();filter()}catch(e){$('status').textContent=e.message}}
function filter(){queue=all.filter(x=>(!$('videos').checked||x.media_available)&&(!$('pending').checked||!x.review));index=Math.min(index,Math.max(0,queue.length-1));show()}
function show(){const s=queue[index];$('media').replaceChildren();$('confirmed').checked=false;$('note').value='';$('status').textContent='';$('progress').textContent=`共 ${all.length} 条代表样本 · ${all.filter(x=>x.media_available).length} 条有候选视频 · 当前 ${queue.length?index+1:0}/${queue.length}`;document.querySelectorAll('[data-vote]').forEach(b=>b.disabled=!s||busy||(!s.media_available&&b.dataset.vote.startsWith('visually_')));if(!s){$('title').textContent='当前队列已处理';$('target').textContent='';$('details').textContent='';$('warning').textContent='';return}$('title').textContent=s.id;
 const e=s.details.external_event;$('target').textContent=e?`外部标签：${e.player} · ${e.canonical_label} · ${e.result}（made=命中，missed=未中）`:'动作类别覆盖或异常样本：'+s.purpose;
 $('warning').textContent=s.media_available?'视频是根据动作序列找到的候选关联；先确认是否为同一次出手。外部时间记法未核实，不能确认精确出手帧。':'尚无匹配媒体，只能审核文字自洽，不能确认视觉准确度。';$('details').textContent=JSON.stringify(s.details,null,2);if(s.media_available){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src='/api/media/'+encodeURIComponent(s.id);v.onerror=()=>$('status').textContent='视频加载失败';$('media').append(v)}}
$('videos').onchange=filter;$('pending').onchange=filter;$('prev').onclick=()=>{index=Math.max(0,index-1);show()};$('next').onclick=()=>{index=Math.min(queue.length-1,index+1);show()};
document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=async()=>{if(busy||!queue[index])return;const s=queue[index];busy=true;document.querySelectorAll('[data-vote]').forEach(x=>x.disabled=true);try{const r=await fetch('/api/review/'+encodeURIComponent(s.id),{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({revision:s.revision,decision:b.dataset.vote,reviewer:$('reviewer').value,note:$('note').value,confirmed:$('confirmed').checked})});const d=await r.json();if(!r.ok)throw Error(d.detail||'保存失败');localStorage.setItem('external-reviewer',$('reviewer').value);await load();$('status').textContent='已保存。只确认本条审核范围，不自动加入训练集。'}catch(e){$('status').textContent=e.message}finally{busy=false;document.querySelectorAll('[data-vote]').forEach(x=>x.disabled=!queue[index]||(!queue[index].media_available&&x.dataset.vote.startsWith('visually_')))}});load();
</script></html>
