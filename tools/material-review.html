<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材人工审核</title><style>body{background:#101c2e;color:#edf3fa;font:16px/1.6 sans-serif;max-width:1100px;margin:24px auto;padding:16px}section{background:#1d3048;padding:20px;border-radius:14px;margin:16px 0}button,input,textarea,select{font:inherit;padding:10px;border-radius:8px;margin:5px}button{cursor:pointer}video,canvas{max-width:100%;max-height:560px;background:#080e18}textarea{width:94%;min-height:80px}pre{white-space:pre-wrap;word-break:break-word}a{color:#8be3cf}.warning{color:#ffd087}#notice{min-height:28px}</style><h1>逐条审核素材</h1><p>通过只确认本条展示的标注及用途，不代表全片正确，也不会自动成为训练或精确金标准。</p><label>审核者 <input id="reviewer" placeholder="填写你的姓名或昵称"></label><label><input type="checkbox" id="pending" checked>仅看待处理</label><button id="refresh">刷新队列</button><a href="/api/export" target="_blank">查看人工确认库</a><p id="progress"></p><section><button id="prev">上一条</button><button id="next">下一条</button><h2 id="title"></h2><p id="scope"></p><p id="warning" class="warning"></p><p id="label"></p><p id="proposal" class="warning"></p><div id="shotControls" hidden><label>出手方式 <select id="shotType"><option value="unknown">未知／不细分</option><option value="layup">上篮</option><option value="floater">抛投</option><option value="jump_shot">跳投</option><option value="dunk">扣篮</option><option value="putback">补篮</option><option value="free_throw">罚球</option></select></label></div><div id="tacticControls" hidden><label>战术 <select id="tactic"><option value="unknown">无法确认</option><optgroup label="传球与持球"><option value="pass">传球</option><option value="catch">接球</option><option value="dribble">运球</option><option value="handoff">手递手</option><option value="drive">持球突破</option></optgroup><optgroup label="无球移动"><option value="baseline_cut">溜底线</option><option value="backdoor_cut">反跑 / 后门切入</option><option value="v_cut">V字切入</option><option value="l_cut">L字切入</option><option value="curl_cut">绕掩护卷切</option><option value="flare_cut">外弹切出</option><option value="off_ball_cut">其他无球切入</option><option value="relocation">无球换位 / 补位</option></optgroup><optgroup label="掩护与配合"><option value="screen">掩护（未细分）</option><option value="on_ball_screen">持球掩护</option><option value="off_ball_screen">无球掩护</option><option value="pick_and_roll">挡拆顺下</option><option value="pick_and_pop">挡拆外弹</option><option value="screen_slip">假掩护提前顺下</option><option value="give_and_go">传切</option><option value="drive_and_kick">突破分球</option><option value="handoff_action">手递手配合</option></optgroup><optgroup label="站位与防守"><option value="spacing">进攻空间 / 站位</option><option value="help_defense">协防</option><option value="switch_defense">换防</option><option value="closeout">扑防</option><option value="box_out">卡位</option><option value="transition">攻防转换</option></optgroup><optgroup label="其他"><option value="no_clear_tactic">未见明确团队配合</option><option value="other">其他（说明证据）</option></optgroup></select></label><label>原片起始秒 <input id="start" type="number" step="0.1"></label><label>结束秒 <input id="end" type="number" step="0.1"></label><p>只标完整可见的动作；说明参与者、跑动和传球关系。上下文不足时选择需修改。</p></div><div id="evidence"></div><details><summary>标注和历史详情</summary><pre id="details"></pre></details></section><section><label><input type="checkbox" id="confirmed">我已查看画面／播放完整片段，并核对本条标注</label><textarea id="note" placeholder="修改意见、驳回原因或不确定之处（不确定与驳回必填）"></textarea><p>框不准确、出手时间不清或标签有误时，请填写意见并选择“无法判断／需修改”；不要勉强通过。</p><button data-decision="approved">通过并收入人工确认库</button><button data-decision="uncertain">无法判断／需修改</button><button data-decision="rejected">驳回</button><p id="notice" role="status"></p></section><script>
const token='__TOKEN__';let all=[],queue=[],position=0,busy=false,renderId=0;const $=id=>document.getElementById(id);$('reviewer').value=localStorage.getItem('material-reviewer')||'';
async function load(){try{const r=await fetch('/api/queue');if(!r.ok)throw Error('队列加载失败');all=await r.json();filter()}catch(e){$('notice').textContent=e.message}}
function filter(){queue=all.filter(x=>!$('pending').checked||!x.human_review||x.proposal);position=Math.min(position,Math.max(0,queue.length-1));show()}
function show(){const generation=++renderId;const item=queue[position];$('evidence').replaceChildren();$('confirmed').checked=false;$('note').value='';$('notice').textContent='';$('progress').textContent=`总数 ${all.length} · 已提交 ${all.filter(x=>x.human_review).length} · 当前队列 ${queue.length} · 第 ${queue.length?position+1:0} 条`;
 document.querySelectorAll('[data-decision]').forEach(b=>b.disabled=!item||busy);
 if(!item){$('title').textContent='当前队列已处理';$('scope').textContent='可取消“仅看待处理”重新检查或修改决定。';$('details').textContent='';$('warning').textContent='';return}
 $('proposal').textContent=item.proposal?'待确认提案：'+item.proposal.instruction+'（不会自动批准）':'';$('shotControls').hidden=item.kind!=='shot';$('shotType').value=item.proposal?.changes?.shot_type||'unknown';$('tacticControls').hidden=item.kind!=='tactic_sample';$('tactic').value='unknown';if(item.kind==='tactic_sample'){$('start').value=item.payload.review_window.start_seconds;$('end').value=item.payload.review_window.end_seconds}
 const a=item.payload.annotation||item.payload;$('label').textContent=item.kind==='shot'?`当前标签：${a.team} · ${a.player} · ${a.points} 分 · ${a.outcome==='made'?'命中':a.outcome==='missed'?'未中':'未知'}`:item.kind==='tactic_sample'?'当前标签：未知，需你确认动作与时间':`当前标注：${(a.objects||[]).length} 个目标`;
 $('title').textContent=item.id;$('scope').textContent=({hoop_crop:'篮圈与篮网区域：绿色框是否覆盖目标？负样本应确实没有篮筐。',frame:'篮球局部标注：绿色框是否准确？这不是穷尽标注。',shot:'投篮事件：播放片段，核对球队、分值和结果；时间目前为粗区间。',tactic_sample:'战术样本：播放上下文，记录看到的配合与问题，填写动作类型、起止时间与证据后方可批准。'})[item.kind];
 $('details').textContent=JSON.stringify({annotation:item.payload,scope:item.scope,previous:item.human_review},null,2);$('warning').textContent=item.kind==='tactic_sample'?'标题和箭头不是动作证据；看清完整动作后方可确认；上下文不足时请选择需修改。':item.admission==='restricted_reference'?'该样本存在遮挡，仅能确认其参考用途。':'';
 const url='/api/'+(item.kind==='tactic_sample'?'context/':'media/')+encodeURIComponent(item.id);
 if(['shot','tactic_sample'].includes(item.kind)){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=url;v.onerror=()=>$('notice').textContent='视频加载失败，请稍后刷新；首次生成战术片段需要几秒。';$('evidence').append(v)}else{const image=new Image();image.onload=()=>{if(generation!==renderId)return;const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const objects=item.payload.objects||item.payload.annotation?.objects||[];ctx.strokeStyle='#53ff79';ctx.lineWidth=3;for(const box of objects){const [x,y,xx,yy]=box.xyxy;ctx.strokeRect(x,y,xx-x,yy-y)}$('evidence').append(c);if(objects.length){const [x,y,xx,yy]=objects[0].xyxy;const margin=Math.max(xx-x,yy-y,30);const left=Math.max(0,x-margin),top=Math.max(0,y-margin),right=Math.min(image.width,xx+margin),bottom=Math.min(image.height,yy+margin);const zoom=document.createElement('canvas');zoom.width=600;zoom.height=400;const z=zoom.getContext('2d');z.drawImage(image,left,top,right-left,bottom-top,0,0,600,400);z.strokeStyle='#53ff79';z.lineWidth=4;z.strokeRect((x-left)*600/(right-left),(y-top)*400/(bottom-top),(xx-x)*600/(right-left),(yy-y)*400/(bottom-top));const caption=document.createElement('p');caption.textContent='第一个目标局部放大（仅辅助查看，坐标仍在原图）';$('evidence').append(caption,zoom)}};image.onerror=()=>$('notice').textContent='图片加载失败';image.src=url}
}
$('pending').onchange=filter;$('refresh').onclick=load;$('prev').onclick=()=>{position=Math.max(0,position-1);show()};$('next').onclick=()=>{position=Math.min(queue.length-1,position+1);show()};
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{if(busy)return;const item=queue[position];if(!item)return;const reviewer=$('reviewer').value.trim();if(!reviewer||!$('confirmed').checked){$('notice').textContent='请填写审核者并勾选已查看证据。';return}busy=true;document.querySelectorAll('[data-decision]').forEach(x=>x.disabled=true);try{const r=await fetch('/api/review/'+encodeURIComponent(item.id),{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({revision:item.revision,decision:b.dataset.decision,reviewer,note:$('note').value,confirmed:true,correction:item.kind==='tactic_sample'?{tactic:$('tactic').value,start_seconds:Number($('start').value),end_seconds:Number($('end').value)}:item.kind==='shot'?{shot_type:$('shotType').value}:item.kind==='hoop_crop'?{object_definition:'hoop_region'}:{}})});const data=await r.json();if(!r.ok)throw Error(data.detail||'保存失败');localStorage.setItem('material-reviewer',reviewer);await load();$('notice').textContent='已保存到数据库。'}catch(e){$('notice').textContent=e.message}finally{busy=false;document.querySelectorAll('[data-decision]').forEach(x=>x.disabled=!queue[position])}});load();
</script></html>
