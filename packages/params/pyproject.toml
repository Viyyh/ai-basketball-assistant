[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-params"
version = "1.1.0"
description = "赛制 × 年龄段参数表与投篮分值判定（全系统唯一真源）"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["basketball_params"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
