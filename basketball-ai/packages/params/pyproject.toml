[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-params"
version = "1.0.0"
description = "赛制与年龄段参数层 —— AI 篮球分析系统全系统唯一真源"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # 只依赖标准库，这是有意为之

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["basketball_params"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
